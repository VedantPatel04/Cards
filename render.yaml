# Optional Render Blueprint: web (Dockerfile) + Redis Key Value.
# No Postgres here — use Supabase; set DATABASE_URL (SSL) + ALLOWED_HOSTS manually.
# Still connect the GitHub repo / secrets in the dashboard after first deploy.

services:
  - type: web
    name: cards-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # No custom health path yet — avoid pointing at POST-only auth routes.
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: REDIS_URL
        fromService:
          name: cards-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: cards-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
