# Local backend stack mirroring Render: web (Docker) + Postgres + Redis.
# Frontend is Vercel (not here). Compose `db` is separate from Mac Postgres.
# web:8000 published; db/redis ports commented out to avoid local clashes.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cards}
      POSTGRES_DB: ${POSTGRES_DB:-cards_db}
    volumes:
      - cards_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cards} -d ${POSTGRES_DB:-cards_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports:
    #   - "5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports:
    #   - "6380:6379"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # All required runtime env is set below. Do not rely on backend/.env inside
    # the container (that file targets host-based manage.py → localhost).
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Compose-internal DNS names — not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-cards}:${POSTGRES_PASSWORD:-cards}@db:5432/${POSTGRES_DB:-cards_db}
      # Local compose Postgres has no TLS; production/Render leave this unset (defaults true).
      DATABASE_SSL_REQUIRE: "false"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-compose-only-dev-secret-not-for-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      # Production settings default this to true; local HTTP would break without it.
      SECURE_SSL_REDIRECT: "false"
      CORS_ALLOWED_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cards_pg_data:
