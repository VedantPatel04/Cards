# CI
#
# Job test:
# Runs the existing Django suite with config.settings.test (SQLite in-memory).
# No Postgres/Redis services required: tests mock or fail-open around Redis.
# Python 3.12 matches the Docker image, not the optional 3.14 laptop venv.
#
# Job frontend:
# npm ci → lint → test → build in frontend/ (Vite + Vitest + oxlint).
#
# Job docker:
# Builds backend/Dockerfile to prove the image still builds. Does NOT push and
# does NOT deploy to Render.


name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --settings=config.settings.test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t cards-api:ci ./backend
