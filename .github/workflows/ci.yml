# CI
#
# Job test:
# Runs the existing Django suite with config.settings.test (SQLite in-memory).
# No Postgres/Redis services required: tests mock or fail-open around Redis.
# Python 3.12 matches the Docker image, not the optional 3.14 laptop venv.
#
# Job docker:
# Builds backend/Dockerfile to prove the image still builds. Does NOT push and
# does NOT deploy to Render — you have no production secrets/URLs yet, and
# auto-deploy from CI would hide misconfiguration behind credentials we should
# not bake into the repo.
#
# NOTE: add deploy after Supabase + Render are connected and you want CD: 
# add a separate job that calls Render's deploy hook or uses their API, with secrets in GitHub Actions.


name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --settings=config.settings.test
        env:
          # test settings use SQLite; these avoid accidental reliance on host env.
          DJANGO_SETTINGS_MODULE: config.settings.test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t cards-api:ci ./backend
